[project]
name = "serviceseeking-mcp"
version = "1.1.0"
description = "Connect ServiceSeeking to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No ServiceSeeking API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["serviceseeking", "serviceseeking api", "serviceseeking mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/mcp/serviceseeking?utm_source=pypi&utm_medium=package&utm_campaign=serviceseeking"
Source = "https://github.com/cotlet-connect/serviceseeking-mcp"

[project.scripts]
serviceseeking-mcp = "serviceseeking_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"serviceseeking_agent.py" = "serviceseeking_agent.py"

[tool.hatch.build.targets.sdist]
include = ["serviceseeking_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
